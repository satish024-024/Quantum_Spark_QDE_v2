<!-- Floating QDE Header & Status Strip -->
<header class="workspace-header">
    <div class="workspace-header-left">
        <a href="/dashboard" class="workspace-logo">
            <i class="fas fa-atom workspace-logo-icon"></i>
            <div class="workspace-logo-text">
                <h1>Quantum Spark</h1>
                <span>QDE Workspace v2</span>
            </div>
        </a>
    </div>

    <!-- Active Session Status Strip -->
    <div class="workspace-status-strip">
        <div class="workspace-status-item">
            <i class="fas fa-server" style="color: var(--accent-aqua);"></i>
            <span>Backend:</span>
            <span id="header-active-backend">ibm_fez</span>
        </div>
        <div class="workspace-status-item">
            <i class="fas fa-tasks"></i>
            <span>Queue:</span>
            <span id="header-queue-depth" class="number-display">3</span>
        </div>
        <div class="workspace-status-item">
            <i class="fas fa-clock"></i>
            <span>Est. Wait:</span>
            <span id="header-wait-time">1.8s</span>
        </div>
        <div class="workspace-status-item">
            <i class="fas fa-coins" style="color: #d97706;"></i>
            <span>Credits:</span>
            <span id="header-credits-remaining">97%</span>
        </div>
    </div>

    <div class="workspace-header-right">
        <div class="workspace-controls-group">
            <button class="btn btn-ghost btn-icon" id="refresh-all-btn" title="Refresh All Data">
                <i class="fas fa-sync-alt"></i>
            </button>
            <button class="btn btn-ghost btn-icon" id="command-palette-btn" title="Command Palette (Ctrl+K)">
                <i class="fas fa-search"></i>
            </button>
            <button class="btn btn-ghost btn-icon" id="tutorial-btn" title="Help & Documentation">
                <i class="fas fa-graduation-cap"></i>
            </button>
            <button class="btn btn-ghost btn-icon" id="customize-btn" title="Layout Preferences">
                <i class="fas fa-sliders-h"></i>
            </button>
        </div>

        <div class="workspace-user-profile" id="user-profile-widget">
            <div class="workspace-user-avatar" id="avatar-initial">S</div>
            <div class="workspace-user-info">
                <span class="email" id="user-email">satishkumarkadali24@gmail.com</span>
                <span class="status">
                    <span class="status-dot status-dot-active"></span>
                    Online
                </span>
            </div>
            <button class="btn btn-ghost" id="change-pw-btn" style="padding: 6px 12px; font-size: 12px;">Change password</button>
            <button class="btn btn-ghost" id="logout-btn" style="padding: 6px 12px; font-size: 12px;">Logout</button>
        </div>
    </div>
</header>

<!-- Change password modal -->
<div id="cpw-modal" style="display:none; position:fixed; inset:0; z-index:9999; align-items:center; justify-content:center; padding:1rem; background:rgba(5,10,20,0.6);">
    <div style="width:100%; max-width:380px; background:#1a2634; color:#fff; border:1px solid rgba(255,255,255,0.12); border-radius:16px; padding:1.5rem;">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem;">
            <h3 style="font-size:1.1rem;"><i class="fas fa-key" style="color:#6ee7ff;"></i> Change password</h3>
            <button id="cpw-close" style="background:none; border:0; color:rgba(255,255,255,0.6); font-size:1.2rem; cursor:pointer;"><i class="fas fa-xmark"></i></button>
        </div>
        <input type="password" id="cpw-current" placeholder="Current password" style="width:100%; padding:0.75rem 1rem; border-radius:10px; margin-bottom:0.8rem; border:1px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.06); color:#fff;">
        <input type="password" id="cpw-new" placeholder="New password (min 6 characters)" style="width:100%; padding:0.75rem 1rem; border-radius:10px; margin-bottom:0.8rem; border:1px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.06); color:#fff;">
        <input type="password" id="cpw-confirm" placeholder="Confirm new password" style="width:100%; padding:0.75rem 1rem; border-radius:10px; margin-bottom:1rem; border:1px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.06); color:#fff;">
        <button id="cpw-save" style="width:100%; padding:0.85rem; border:0; border-radius:10px; background:linear-gradient(90deg,#00c6ff,#0072ff); color:#fff; font-weight:600; cursor:pointer;">Update password</button>
        <div id="cpw-msg" style="margin-top:0.8rem; font-size:0.88rem; display:none;"></div>
    </div>
</div>
<script>
(function () {
    var modal = document.getElementById('cpw-modal');
    var msg = document.getElementById('cpw-msg');
    function showMsg(t, ok) {
        msg.style.display = 'block';
        msg.style.color = ok ? '#a9f0c6' : '#ffb3ab';
        msg.textContent = t;
    }
    var openBtn = document.getElementById('change-pw-btn');
    if (openBtn) openBtn.addEventListener('click', function () {
        msg.style.display = 'none'; msg.textContent = '';
        document.getElementById('cpw-current').value = '';
        document.getElementById('cpw-new').value = '';
        document.getElementById('cpw-confirm').value = '';
        modal.style.display = 'flex';
    });
    document.getElementById('cpw-close').addEventListener('click', function () { modal.style.display = 'none'; });
    modal.addEventListener('click', function (e) { if (e.target === modal) modal.style.display = 'none'; });
    document.getElementById('cpw-save').addEventListener('click', async function () {
        var cur = document.getElementById('cpw-current').value;
        var nw = document.getElementById('cpw-new').value;
        var cf = document.getElementById('cpw-confirm').value;
        if (!cur || !nw) { showMsg('Please fill in all fields.', false); return; }
        if (nw.length < 6) { showMsg('New password must be at least 6 characters.', false); return; }
        if (nw !== cf) { showMsg('New passwords do not match.', false); return; }
        var btn = this; btn.disabled = true; btn.textContent = 'Updating…';
        try {
            const r = await fetch('/api/change-password', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({current_password: cur, new_password: nw})
            });
            const d = await r.json();
            showMsg(d.message, d.success);
            if (d.success) setTimeout(function () { modal.style.display = 'none'; }, 1500);
        } catch (e) { showMsg('Connection error. Please try again.', false); }
        btn.disabled = false; btn.textContent = 'Update password';
    });
})();
</script>

<script>
// Keep Header active backend synced with central state
if (window.WorkspaceState) {
    window.WorkspaceState.subscribe(state => {
        const headerBackend = document.getElementById('header-active-backend');
        if (headerBackend && state && state.activeBackend) {
            headerBackend.innerText = state.activeBackend.name;
        }
    });
}

// Command palette button click handler
const commandPaletteBtn = document.getElementById('command-palette-btn');
if (commandPaletteBtn) {
    commandPaletteBtn.addEventListener('click', () => {
        if (window.KeyboardShortcuts && typeof window.KeyboardShortcuts.toggleCommandPalette === 'function') {
            window.KeyboardShortcuts.toggleCommandPalette();
        }
    });
}

// Refresh all button click handler
const refreshAllBtn = document.getElementById('refresh-all-btn');
if (refreshAllBtn) {
    refreshAllBtn.addEventListener('click', async () => {
        const icon = refreshAllBtn.querySelector('i');
        if (icon) icon.classList.add('fa-spin');
        try {
            if (window.dashboard && typeof window.dashboard.refreshData === 'function') {
                await window.dashboard.refreshData();
            } else if (window.quantumWidgets) {
                await window.quantumWidgets.preloadLocalData();
                await window.quantumWidgets.updateAllWidgets();
            }
        } catch (e) {
            console.error('Refresh failed:', e);
        } finally {
            setTimeout(() => {
                if (icon) icon.classList.remove('fa-spin');
            }, 1000);
        }
    });
}

// Tutorial button click handler
const tutorialBtn = document.getElementById('tutorial-btn');
if (tutorialBtn) {
    tutorialBtn.addEventListener('click', () => {
        if (window.quantumTutorial && typeof window.quantumTutorial.start === 'function') {
            window.quantumTutorial.start();
        }
    });
}

// Customize/theme switcher button click handler
const customizeBtn = document.getElementById('customize-btn');
if (customizeBtn) {
    customizeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (window.themeSwitcher && typeof window.themeSwitcher.toggleThemeDropdown === 'function') {
            window.themeSwitcher.toggleThemeDropdown();
        }
    });
}

// Logout button click handler
const logoutBtn = document.getElementById('logout-btn');
if (logoutBtn) {
    logoutBtn.addEventListener('click', async () => {
        try {
            const res = await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/auth';
        } catch (e) {
            console.error('Logout failed:', e);
            window.location.href = '/auth';
        }
    });
}
</script>
