<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reset Password — Quantum Spark</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
        min-height: 100vh; min-height: 100dvh;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        padding: 1rem; color: #fff;
    }
    .card {
        width: 100%; max-width: 420px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 20px; padding: 2rem 1.75rem;
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .card h1 { font-size: 1.4rem; margin-bottom: 0.4rem; display: flex; align-items: center; gap: 0.6rem; }
    .card h1 i { color: #6ee7ff; }
    .card p.sub { color: rgba(255,255,255,0.7); font-size: 0.9rem; margin-bottom: 1.4rem; }
    .field { position: relative; margin-bottom: 1rem; }
    .field input {
        width: 100%; padding: 0.85rem 2.8rem 0.85rem 1rem;
        border-radius: 12px; border: 1px solid rgba(255,255,255,0.2);
        background: rgba(255,255,255,0.07); color: #fff; font-size: 1rem; outline: none;
    }
    .field input:focus { border-color: #6ee7ff; }
    .field .toggle {
        position: absolute; right: 0.9rem; top: 50%; transform: translateY(-50%);
        color: rgba(255,255,255,0.6); cursor: pointer; font-size: 1rem; padding: 0.3rem;
    }
    .btn {
        width: 100%; padding: 0.9rem; border: 0; border-radius: 12px;
        background: linear-gradient(90deg, #00c6ff, #0072ff);
        color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 0.4rem;
    }
    .btn:disabled { opacity: 0.6; cursor: default; }
    .msg { margin-top: 1rem; padding: 0.8rem 1rem; border-radius: 10px; font-size: 0.9rem; display: none; }
    .msg.ok { display: block; background: rgba(46,204,113,0.15); border: 1px solid rgba(46,204,113,0.4); color: #a9f0c6; }
    .msg.err { display: block; background: rgba(231,76,60,0.15); border: 1px solid rgba(231,76,60,0.4); color: #ffb3ab; }
    .back { display: block; text-align: center; margin-top: 1.2rem; color: rgba(255,255,255,0.7); font-size: 0.9rem; text-decoration: none; }
    .back:hover { color: #fff; }
</style>
</head>
<body>
<div class="card">
    <h1><i class="fas fa-key"></i> Set a new password</h1>
    <p class="sub">Choose a new password for your account. The reset link expires in 1 hour and can be used only once.</p>
    <div class="field">
        <input type="password" id="np1" placeholder="New password (min 6 characters)" autocomplete="new-password">
        <span class="toggle" data-for="np1"><i class="fas fa-eye"></i></span>
    </div>
    <div class="field">
        <input type="password" id="np2" placeholder="Confirm new password" autocomplete="new-password">
        <span class="toggle" data-for="np2"><i class="fas fa-eye"></i></span>
    </div>
    <button class="btn" id="resetBtn">Reset password</button>
    <div class="msg" id="msg"></div>
    <a class="back" href="/auth"><i class="fas fa-arrow-left"></i> Back to login</a>
</div>
<script>
(function () {
    var token = new URLSearchParams(location.search).get('token') || '';
    var msg = document.getElementById('msg');
    function show(t, ok) { msg.textContent = t; msg.className = 'msg ' + (ok ? 'ok' : 'err'); }
    document.querySelectorAll('.toggle').forEach(function (el) {
        el.addEventListener('click', function () {
            var inp = document.getElementById(el.dataset.for);
            var showPw = inp.type === 'password';
            inp.type = showPw ? 'text' : 'password';
            el.innerHTML = '<i class="fas fa-eye' + (showPw ? '' : '-slash') + '"></i>';
        });
    });
    if (!token) show('This reset link is missing its token. Please request a new one from the login page.', false);
    document.getElementById('resetBtn').addEventListener('click', function () {
        var p1 = document.getElementById('np1').value;
        var p2 = document.getElementById('np2').value;
        if (!token) { show('Missing reset token.', false); return; }
        if (p1.length < 6) { show('Password must be at least 6 characters.', false); return; }
        if (p1 !== p2) { show('Passwords do not match.', false); return; }
        var btn = this; btn.disabled = true; btn.textContent = 'Resetting…';
        fetch('/api/reset-password', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({token: token, new_password: p1})
        }).then(function (r) { return r.json(); }).then(function (d) {
            show(d.message, d.success);
            if (d.success) setTimeout(function () { location.href = '/auth'; }, 1800);
            else { btn.disabled = false; btn.textContent = 'Reset password'; }
        }).catch(function () {
            show('Network error. Please try again.', false);
            btn.disabled = false; btn.textContent = 'Reset password';
        });
    });
})();
</script>
</body>
</html>
